name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Les tests de l'adaptateur de lecture ont besoin d'une base réelle : ils vérifient la
    # traduction entre le modèle relationnel et le contrat du dashboard, ce qu'aucune
    # doublure ne peut faire. Sans ce service, ils seraient silencieusement ignorés.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentscope
          POSTGRES_PASSWORD: agentscope
          POSTGRES_DB: agentscope
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://agentscope:agentscope@localhost:5432/agentscope

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Installer les dépendances
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Migrations
        run: alembic upgrade head

      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend (types + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérification des types
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
